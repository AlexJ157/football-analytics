<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Match Detail</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="match-header">
            <a class="back-link" href="index.html">← Back to fixtures</a>
            <div>
                <span id="competition-tag" class="competition-tag" ></span>
                <div class="matchup">
                    <!-- home side -->
                    <div class="side">
                        <img id="home-crest" class="crest" src="" alt="">
                        <div id="home-name" class="team-name"></div>
                    </div>

                    <!-- date -->
                    <div class="kickoff">
                        <div id="match-time"></div>
                        <div id="match-date" class="time"></div>
                    </div>

                    <!-- away side -->
                    <div id="away-side" class="side">
                        <img id="away-crest" class="crest" src="" alt="">
                        <div id="away-name" class="team-name"></div>
                    </div>
                </div>
            </div>
        </div>

        <main>
            <div class="card">
                <h2>Match Prediction</h2>

                <!-- home prediction -->
                <div class="prob-row home">
                    <div id="home-win" class="label">fef</div>
                    <div id="home-prob" class="value"></div>
                </div>
                <div class="prob-bar-track">
                    <div id="home-win-bar" class="prob-bar-fill home"></div>
                </div>
                
                <!-- draw prediction -->
                <div class="prob-row draw">
                    <div class="label">Draw</div>
                    <div id="draw-prob" class="value"></div>
                </div>
                <div class="prob-bar-track">
                    <div id="draw-bar" class="prob-bar-fill draw"></div>
                </div>

                <!-- away prediction -->
                <div class="prob-row away">
                    <div id="away-win" class="label"></div>
                    <div id="away-prob" class="value"></div>
                </div>
                <div class="prob-bar-track">
                    <div id="away-win-bar" class="prob-bar-fill away"></div>
                </div>
            </div>

            <div class="card">
                <h2>Last 5 Results</h2>
                <div class="form-grid">
                    <div>
                        <!-- home last 5 -->
                        <div id="home-form-name" class="form-team-name"></div>
                        <div id="home-form" class="form-chips"></div>
                    </div>
                    
                    <div>
                        <!-- home away 5 -->
                        <div id="away-form-name" class="form-team-name"></div>
                        <div id="away-form" class="form-chips"></div>
                    </div>
                </div>
            </div>

            <div id="h2h-record" class="card">
                <h2>Head to Head Record</h2>
                <div class="h2h-summary">
                    <div>
                        <div id="h2h-home-wins" class="num"></div>
                        <div id="h2h-home-name" class="lbl"></div>
                    </div>

                    <div>
                        <div id="h2h-draws" class="num"></div>
                        <div class="lbl">Draws</div>
                    </div>

                    <div>
                        <div id="h2h-away-wins" class="num"></div>
                        <div id="h2h-away-name" class="lbl"></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Top Scorers This Season</h2>
                <div class="scorers-columns">
                    <!-- home top scorers -->
                    <div id="home-top-scorers">
                        <div id="home-scorers" class="scorers-team-name"></div>
                    </div>

                    <!-- away top scorers -->
                    <div id="away-top-scorers">
                        <div id="away-scorers" class="scorers-team-name"></div>
                    
                    </div>
                </div>
            </div>

        </main>
        <script src="match.js"></script>
    </body>
</html>
